help: |
  命令写法：命令名不带前导斜杠。私聊直接发送命令名；群聊中先 @ 机器人再发送命令名（群聊里用 / 前缀也能唤醒）。

  用户命令:
  - 好感度 - 查看当前情感状态
  - 状态显示 - 切换是否在对话后显示状态
  - 关系阶段 - 查看当前关系阶段与建议
  - 心情 - 查看 bot 当前心情与最近一次变化原因
  - 好感排行 [数量] - 查看好感度前 N 名
  - 负好感排行 [数量] - 查看负好感度前 N 名
  - 缓存统计 - 查看缓存命中率、内存使用

  管理员命令:
  - 设置好感 <用户ID> <数值> - 设置用户好感度
  - 设置亲密 <用户ID> <数值> - 设置用户亲密度
  - 设置态度 <用户ID> <态度> - 设置 AI 对用户态度
  - 设置关系 <用户ID> <关系> - 设置双方关系描述
  - 重置好感 <用户ID> - 重置用户情感状态
  - 查看好感 <用户ID> - 查看用户完整状态
  - 隐私级别 <0|1|2> - 设置全局隐私级别
  - 备份数据 - 立即创建数据备份
  - 重置插件 - 清空所有数据
  - 清理初始用户 - 清理不活跃初始状态缓存

  调试命令（管理员）:
  - 调试事件 - 查看事件结构
  - 调试记忆 - 查看用户记忆系统状态
  - 修复互动统计 - 修复损坏的互动统计数据
