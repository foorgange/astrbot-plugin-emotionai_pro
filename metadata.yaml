category: ai_tools
desc: >
  EmotionAI Pro 给 AI 角色装上一套会成长的情感与关系：好感度越高，它越会记住并主动提起与你相处的细节，态度也更亲近；好感度低时只记得冲突与边界，语气更冷。它会记住与你相处的经历，对你有真实的态度，也会随着一次次对话慢慢改变关系的远近。好感度与亲密度共同决定关系阶段，喜悦、信任、愤怒、期待等情绪随对话起伏，心情在全场共享、久不互动时自行平复；关系变差时也有冷淡、反感和敌对的变化路径。情感分析在后台完成，不会拖慢回复，所有描述都会沿用你配置的 bot 人设名；关系阶段名称、亲密度变化幅度和状态展示也都可以按自己的喜好调整，并附带长期记忆、自动备份、数据迁移与完整的管理命令。

