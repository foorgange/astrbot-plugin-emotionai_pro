name: astrbot_plugin_emotionai_pro
display_name: EmotionAI Pro
short_desc: 让 AI 拥有真实、渐进、可养成的情感与关系
version: v4.0.17
author: asakiyoshi (原作者), foorgange (修复)
social_link: https://github.com/foorgange
desc: >
  EmotionAI Pro —— 让你的 AI 拥有真实、渐进、可养成的情感与关系。

  它不是简单的「好感度加减」，而是给 AI 角色装上一套完整的内心世界：
  会记住你，会对你有态度，会随着相处慢慢改变关系，也会在你说错话时
  真的变得冷淡。适合群聊互动、私聊陪伴、角色扮演与剧情养成。


  【8 维情感模型】

  喜悦、信任、恐惧、惊讶、悲伤、厌恶、愤怒、期待。每次对话都会真实影响
  AI 的情绪构成，而不是只给一个数字加减。


  【4 阶段关系演化】

  初识期 → 深化期 → 承诺期 → 共生期，好感度与亲密度按不同权重共同推进；
  关系变差时还会进入冷淡期 / 反感期 / 敌对期，有真实的「变坏」路径。
  阶段跃迁带滞后带与保护分，不会因为一次波动就反复横跳或掉级。


  【AI 自主生成态度与关系描述】

  由独立的情感分析模型结合长期记忆与最近几轮对话，用第一人称口语描述
  「我现在怎么看你」「我们是什么关系」，读起来像真的在相处。


  【长期记忆】

  短期缓存 + 长期落盘 + 重要事件队列，跨重启保留关系轨迹；
  只有真正重要的事才会被记进长期记忆。


  【全局心情】

  心情由所有对话共享，随每条消息实时演进，可在对话中显示当前心情与强度。


  【智能更新】

  关键词、时间、对话计数、模型标记四维判断，无需等到固定轮次才更新，
  也不会每条消息都白跑一次分析。


  【人设一致性】

  注入的情感状态只作为参考，不会抢占你设定的人设；描述中也不会自称
  「AI」，而是自动使用你配置的 bot 人设名。


  【管理与运维】

  完整的用户 / 管理员命令（好感度、亲密度、态度、关系、排行榜、隐私级别、
  备份与恢复），以及自动备份、数据迁移与互动统计修复。


  【性能】

  异步非阻塞设计 + 分片缓存，情感分析在后台完成，不会拖慢 AI 的回复。


  本项目基于原作者 asakiyoshi 的 EmotionAI Pro 修复与维护。

