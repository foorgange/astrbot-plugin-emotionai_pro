name: astrbot_plugin_emotionai_pro
display_name: EmotionAI Pro
short_desc: AstrBot 高级情感智能交互插件（含 bug 修复版）
version: v4.0.5
author: asakiyoshi (原作者), foorgange (修复)
social_link: https://github.com/foorgange
desc: >
  基于 asakiyoshi 开发的 EmotionAI Pro v4.0.0 的修复版本。
  原仓库 https://github.com/asakiyoshi/EmotionAI-Pro 已长期未更新，
  作者 GitHub 也很久没活跃，提交的 PR 可能无法被及时合并。
  因此发布此修复版本到插件市场，确保用户能正常使用。


  插件功能：
  支持 8 维情感模型、4 阶段关系演化、长期记忆系统、智能更新机制、
  排行榜、管理员控制、缓存优化与备份恢复等功能。


  v4.0.5 修复内容（by foorgange）：

  1. /好感度 命令新增「心情 + 强度」实时显示：心情取 8 维情绪
     模型的主导情感，强度归一化到 0-100 并附中文心情描述，
     与 LLM 注入上下文同一口径。
  2. 管理员 /查看好感 的情感强度显示修复：原误用 8 维原始和
     (0-800) 并标注 %，会显示 300% 等错误值，现归一化到 0-100。
  3. 不触碰 LLM 请求注入路径，缓存命中率不受影响。


  v4.0.4 修复内容（by foorgange）：

  1. 修复"无效的态度描述格式"报错：验证正则不允许中文标点，
     而 AI 生成的自然中文描述几乎必带标点（，。！？），导致
     情感更新整体失败。
     现已放行常见中文标点，并在情感分析提示词中要求态度/关系
     描述不超过 20 字（禁止逗号连接的长句），截断兜底同步到 20 字。
     实测描述正常更新（如"俏皮调侃带点宠溺"），报错清零。


  v4.0.3 修复内容（by foorgange）：

  1. 修复 LLM 上下文缓存命中率暴跌的核心问题：情感状态块
     （好感度/亲密度/情绪值/互动次数）每条消息都会变化，但被追加到
     system_prompt 末尾。DeepSeek 等提供商使用前缀缓存，system_prompt
     位于消息数组最前面，任何数字变化都会使后续所有历史 token 的缓存
     全部失效，命中率跌至 25% 以下。
     现已将情感上下文移动到 extra_user_content_parts（当前用户消息之后），
     system_prompt 与历史消息前缀保持稳定，缓存命中率实测恢复至 97%。


  v4.0.2 修复内容（by foorgange）：

  1. 修复好感度永远不更新的核心 bug：should_update_emotion() 返回 3 个值
     但调用处只解包了 2 个，导致每次触发更新都抛 ValueError 崩溃。

  2. 修复态度/关系描述的正则验证过严（限制 20/30 字），
     中文 AI 生成的描述频繁超长被拒，报"无效的态度描述格式"。

  3. 同步 emotion_expert 中态度截断上限与验证规则一致（30 -> 50 字）。

  所有修复已向上游仓库提交 PR：https://github.com/asakiyoshi/EmotionAI-Pro/pull/4
url: https://github.com/foorgange/astrbot-plugin-emotionai_pro
tags:
